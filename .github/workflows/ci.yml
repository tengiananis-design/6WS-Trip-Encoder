name: Backend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [backend-rebuild]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app.py worker.py services
      - name: Check dashboard JavaScript syntax
        run: node --check static/app.js
      - name: Build Docker image
        run: docker build --tag 6ws-trip-encoder:ci .
      - name: Smoke-test container health endpoint
        run: |
          docker run --detach --rm --name 6ws-ci -p 10000:10000 -e APP_USERNAME=ci -e APP_PASSWORD=ci-secret -e GEMINI_API_KEY=ci-placeholder 6ws-trip-encoder:ci
          trap 'docker stop 6ws-ci >/dev/null 2>&1 || true' EXIT
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:10000/health
      - name: Run processor unit tests
        run: python -m unittest discover -s tests -v

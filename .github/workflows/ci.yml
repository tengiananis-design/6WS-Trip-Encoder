name: Backend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [backend-rebuild]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app.py worker.py services
      - name: Check dashboard JavaScript syntax
        run: node --check static/app.js
      - name: Build Docker image
        run: docker build --tag 6ws-trip-encoder:ci .
      - name: Run processor unit tests
        run: python -m unittest discover -s tests -v

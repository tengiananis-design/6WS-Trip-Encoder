name: 6WS backend tests

concurrency:
  group: 6ws-tests-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - konan/backend-rebuild
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app.py worker.py services tests
      - name: Check dashboard JavaScript syntax
        run: node --check static/app.js
      - name: Import FastAPI application
        run: python -c "import app; assert app.app.title == '6WS Trip Encoder'"
      - name: Build production Docker image
        run: docker build -t 6ws-trip-encoder:test .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v


services:
  - type: web
    name: 6ws-trip-encoder
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: MAX_UPLOAD_FILES
        value: "150"
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
      - key: OCR_DPI
        value: "200"
      - key: OCR_MAX_WORKERS
        value: "2"
      - key: PDF_EXTRACTION_WORKERS
        value: "2"
